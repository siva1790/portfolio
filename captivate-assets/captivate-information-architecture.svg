<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1280" viewBox="0 0 1800 1280" role="img" aria-labelledby="title desc">
  <title id="title">Captivate role-based information architecture</title>
  <desc id="desc">Information architecture for Captivate showing one shared visit record connected to role-based workspaces for requesters, coordinators, service owners and admins.</desc>
  <defs>
    <style>
      .bg{fill:#f7f5f2}.ink{fill:#17211b}.muted{fill:#5f6962}.green{fill:#167d45}.greenSoft{fill:#e8f5ed;stroke:#b9d0c0;stroke-width:2}.blue{fill:#edf4fc;stroke:#b8cee5;stroke-width:2}.amber{fill:#fff4dc;stroke:#e6c985;stroke-width:2}.red{fill:#fff0ef;stroke:#e2b7b3;stroke-width:2}.panel{fill:#fff;stroke:#d9ddd9;stroke-width:2}.dark{fill:#17211b}.lime{fill:#c7f05b}.label{font:700 14px Arial,sans-serif;letter-spacing:2px;fill:#167d45}.labelLight{font:700 14px Arial,sans-serif;letter-spacing:2px;fill:#c7f05b}.h1{font:700 38px Arial,sans-serif;fill:#17211b}.h2{font:700 22px Arial,sans-serif;fill:#17211b}.h2Light{font:700 22px Arial,sans-serif;fill:#fff}.h3{font:700 16px Arial,sans-serif;fill:#17211b}.body{font:15px Arial,sans-serif;fill:#526058}.small{font:13px Arial,sans-serif;fill:#647067}.tiny{font:12px Arial,sans-serif;fill:#647067}.white{fill:#fff}.center{text-anchor:middle}.line{fill:none;stroke:#8ea097;stroke-width:2.5}.flow{fill:none;stroke:#167d45;stroke-width:3}.blueLine{fill:none;stroke:#2765a8;stroke-width:2.5}.amberLine{fill:none;stroke:#a86000;stroke-width:2.5}.dash{stroke-dasharray:8 7}.pill{fill:#eef3ef;stroke:#c8d6cd;stroke-width:1.5}.chipText{font:700 12px Arial,sans-serif;fill:#17211b}.arrow{fill:#167d45}.arrowGray{fill:#8ea097}.shadow{filter:url(#shadow)}
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6.8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" class="arrow"/></marker>
    <marker id="arrowGray" markerWidth="8" markerHeight="8" refX="6.8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" class="arrowGray"/></marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#17211b" flood-opacity=".09"/></filter>
  </defs>

  <rect width="1800" height="1280" class="bg"/>
  <text x="72" y="64" class="label">CAPTIVATE - INFORMATION ARCHITECTURE</text>
  <text x="72" y="112" class="h1">One shared visit record, multiple role-based workspaces</text>
  <text x="72" y="146" class="body">A single Captivate platform connects requesters, coordinators, service owners and admins without creating a separate admin tool.</text>

  <!-- Role workspaces -->
  <rect x="70" y="188" width="1660" height="274" rx="24" class="panel"/>
  <text x="100" y="224" class="label">01 - ROLE-BASED WORKSPACES</text>
  <text x="100" y="253" class="small">Each role works from the same visit data, but sees different tasks, queues and decisions.</text>

  <g class="shadow">
    <rect x="102" y="286" width="370" height="132" rx="18" class="greenSoft"/>
    <circle cx="142" cy="334" r="20" class="green"/><text x="142" y="340" class="h3 white center">R</text>
    <text x="178" y="321" class="h2">Requester workspace</text>
    <text x="178" y="350" class="small">Plan visits, edit details, answer questions</text>
    <text x="178" y="373" class="small">and track service confirmations.</text>

    <rect x="510" y="286" width="370" height="132" rx="18" class="blue"/>
    <circle cx="550" cy="334" r="20" fill="#2765a8"/><text x="550" y="340" class="h3 white center">C</text>
    <text x="586" y="321" class="h2">Coordinator workspace</text>
    <text x="586" y="350" class="small">Triage requests, assign owners, watch SLA</text>
    <text x="586" y="373" class="small">risk and resolve blockers.</text>

    <rect x="918" y="286" width="370" height="132" rx="18" class="amber"/>
    <circle cx="958" cy="334" r="20" fill="#a86000"/><text x="958" y="340" class="h3 white center">S</text>
    <text x="994" y="321" class="h2">Service owner workspace</text>
    <text x="994" y="350" class="small">Review assigned services, ask focused</text>
    <text x="994" y="373" class="small">questions, confirm or decline support.</text>

    <rect x="1326" y="286" width="370" height="132" rx="18" class="red"/>
    <circle cx="1366" cy="334" r="20" fill="#a43a3a"/><text x="1366" y="340" class="h3 white center">A</text>
    <text x="1402" y="321" class="h2">Admin / reporting</text>
    <text x="1402" y="350" class="small">Monitor workload, bottlenecks, metrics</text>
    <text x="1402" y="373" class="small">and service catalog configuration.</text>
  </g>

  <!-- Shared visit record -->
  <rect x="70" y="520" width="1660" height="410" rx="24" class="dark"/>
  <text x="100" y="558" class="labelLight">02 - SHARED CAPTIVATE DATA MODEL</text>
  <text x="100" y="588" class="small white">All role views read from and write back to one visit record.</text>

  <rect x="690" y="622" width="420" height="122" rx="20" fill="#fff" class="shadow"/>
  <text x="900" y="659" class="h2 center">Shared visit record</text>
  <text x="900" y="688" class="small center">CX-100908 - Dell Technologies leadership visit</text>
  <text x="900" y="712" class="tiny center">Status, activity, questions, owners and change history</text>

  <path d="M287 418V500H900V622" class="flow" marker-end="url(#arrow)"/>
  <path d="M695 418V500H900V622" class="blueLine" marker-end="url(#arrowGray)"/>
  <path d="M1103 418V500H900V622" class="amberLine" marker-end="url(#arrowGray)"/>
  <path d="M1511 418V500H900V622" class="line" marker-end="url(#arrowGray)"/>

  <g class="shadow">
    <rect x="112" y="790" width="250" height="92" rx="16" fill="#fff"/>
    <text x="237" y="824" class="h3 center">Visit</text>
    <text x="237" y="850" class="tiny center">client, purpose, dates, sponsor</text>

    <rect x="390" y="790" width="250" height="92" rx="16" fill="#fff"/>
    <text x="515" y="824" class="h3 center">Locations</text>
    <text x="515" y="850" class="tiny center">city, office, local coordinator</text>

    <rect x="668" y="790" width="250" height="92" rx="16" fill="#fff"/>
    <text x="793" y="824" class="h3 center">Sessions</text>
    <text x="793" y="850" class="tiny center">time, room, audience, format</text>

    <rect x="946" y="790" width="250" height="92" rx="16" fill="#fff"/>
    <text x="1071" y="824" class="h3 center">Services</text>
    <text x="1071" y="850" class="tiny center">owner, status, lead time, details</text>

    <rect x="1224" y="790" width="250" height="92" rx="16" fill="#fff"/>
    <text x="1349" y="824" class="h3 center">Attendees</text>
    <text x="1349" y="850" class="tiny center">visitors, hosts, IDs, access</text>

    <rect x="1502" y="790" width="166" height="92" rx="16" fill="#fff"/>
    <text x="1585" y="824" class="h3 center">History</text>
    <text x="1585" y="850" class="tiny center">changes + feedback</text>
  </g>

  <path d="M690 690H237V790" class="line" marker-end="url(#arrowGray)"/>
  <path d="M760 744V790" class="line" marker-end="url(#arrowGray)"/>
  <path d="M900 744V770H1071V790" class="line" marker-end="url(#arrowGray)"/>
  <path d="M1040 744V770H1349V790" class="line" marker-end="url(#arrowGray)"/>
  <path d="M1110 690H1585V790" class="line" marker-end="url(#arrowGray)"/>
  <path d="M362 836H390" class="flow" marker-end="url(#arrow)"/>
  <path d="M640 836H668" class="flow" marker-end="url(#arrow)"/>
  <path d="M918 836H946" class="flow" marker-end="url(#arrow)"/>
  <path d="M1196 836H1224" class="flow" marker-end="url(#arrow)"/>
  <path d="M1474 836H1502" class="flow" marker-end="url(#arrow)"/>

  <!-- Action layer -->
  <rect x="70" y="984" width="1660" height="210" rx="24" class="panel"/>
  <text x="100" y="1021" class="label">03 - ROLE-SPECIFIC ACTIONS ON THE SAME RECORD</text>

  <g>
    <rect x="102" y="1058" width="350" height="92" rx="16" class="greenSoft"/>
    <text x="126" y="1090" class="h3">Requester</text>
    <text x="126" y="1117" class="small">Plan - edit - answer questions - track status</text>

    <rect x="500" y="1058" width="350" height="92" rx="16" class="blue"/>
    <text x="524" y="1090" class="h3">Coordinator</text>
    <text x="524" y="1117" class="small">Assign owners - manage SLA - resolve blockers</text>

    <rect x="898" y="1058" width="350" height="92" rx="16" class="amber"/>
    <text x="922" y="1090" class="h3">Service owner</text>
    <text x="922" y="1117" class="small">Confirm - ask - decline - mark complete</text>

    <rect x="1296" y="1058" width="350" height="92" rx="16" class="red"/>
    <text x="1320" y="1090" class="h3">Admin</text>
    <text x="1320" y="1117" class="small">Report - configure catalog - monitor workload</text>
  </g>

  <path d="M277 1058V930" class="flow" marker-end="url(#arrow)"/>
  <path d="M675 1058V930" class="blueLine" marker-end="url(#arrowGray)"/>
  <path d="M1073 1058V930" class="amberLine" marker-end="url(#arrowGray)"/>
  <path d="M1471 1058V930" class="line" marker-end="url(#arrowGray)"/>

  <!-- Omnichannel layer -->
  <rect x="70" y="1220" width="1660" height="1" fill="#d9ddd9"/>
  <text x="100" y="1248" class="tiny">Shared notification and activity layer: dashboard alerts - email updates - focused visit conversation - audit trail - reporting exports</text>
</svg>
