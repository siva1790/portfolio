<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1680" viewBox="0 0 2400 1680" role="img" aria-labelledby="title desc">
  <title id="title">Captivate role-based service blueprint</title>
  <desc id="desc">A future-state service blueprint for Captivate showing six visit coordination phases across requester, coordinator, service owner, admin, system and measurement lanes.</desc>
  <defs>
    <style>
      .bg{fill:#f7f5f2}.ink{fill:#17211b}.muted{fill:#5f6962}.green{fill:#167d45}.greenSoft{fill:#f7fbf8;stroke:#d9e6dd;stroke-width:2}.blueSoft{fill:#f7fafc;stroke:#d9e3ee;stroke-width:2}.amberSoft{fill:#fffaf0;stroke:#eadfbd;stroke-width:2}.redSoft{fill:#fff8f7;stroke:#ead8d5;stroke-width:2}.panel{fill:#fff;stroke:#d9ddd9;stroke-width:2}.lane{fill:#f2f5f1;stroke:#d9ddd9;stroke-width:2}.laneAlt{fill:#f5f7f4;stroke:#d9ddd9;stroke-width:2}.phase{fill:#f5f8f5;stroke:#d9ddd9;stroke-width:2}.phaseAlt{fill:#fbfbf8;stroke:#d9ddd9;stroke-width:2}.system{fill:#f8fafb;stroke:#dbe2e8;stroke-width:2}.measure{fill:#f8fbf7;stroke:#dce8dd;stroke-width:2}.h1{font:700 38px Arial,sans-serif;fill:#17211b}.h2{font:700 21px Arial,sans-serif;fill:#17211b}.h3{font:700 16px Arial,sans-serif;fill:#17211b}.label{font:700 14px Arial,sans-serif;letter-spacing:2px;fill:#167d45}.labelLight{font:700 14px Arial,sans-serif;letter-spacing:1.5px;fill:#167d45}.laneText{font:700 17px Arial,sans-serif;fill:#17211b}.body{font:15px Arial,sans-serif;fill:#526058}.small{font:13px Arial,sans-serif;fill:#647067}.tiny{font:12px Arial,sans-serif;fill:#647067}.white{fill:#647067}.center{text-anchor:middle}.flow{fill:none;stroke:#167d45;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.flowBlue{fill:none;stroke:#2765a8;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round}.flowAmber{fill:none;stroke:#a86000;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round}.dash{stroke-dasharray:10 8}.thin{fill:none;stroke:#a9b6ad;stroke-width:2}.chip{fill:#eef3ef;stroke:#c8d6cd;stroke-width:1.5}.shadow{filter:url(#shadow)}
    </style>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8.5" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#167d45"/></marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8.5" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#2765a8"/></marker>
    <marker id="arrowAmber" markerWidth="10" markerHeight="10" refX="8.5" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#a86000"/></marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#17211b" flood-opacity=".08"/></filter>
  </defs>

  <rect width="2400" height="1680" class="bg"/>
  <text x="72" y="66" class="label">CAPTIVATE - SERVICE BLUEPRINT</text>
  <text x="72" y="116" class="h1">Shared role-based coordination from request to closeout</text>
  <text x="72" y="152" class="body">The same Captivate tool supports requesters, coordinators, service owners and admins through role-specific workspaces on one shared visit record.</text>

  <g transform="translate(72 190)">
    <rect x="0" y="0" width="2256" height="98" rx="20" class="panel"/>
    <text x="26" y="35" class="label">PRIMARY HANDOFF FLOW</text>
    <text x="26" y="66" class="small">Solid arrows show the core path; dashed arrows show clarification loops.</text>
    <g transform="translate(470 24)">
      <rect x="0" y="0" width="220" height="50" rx="14" class="greenSoft"/>
      <text x="110" y="31" class="h3 center">Request starts</text>
      <path d="M220 25H295" class="flow" marker-end="url(#arrowGreen)"/>
      <rect x="300" y="0" width="238" height="50" rx="14" class="blueSoft"/>
      <text x="419" y="31" class="h3 center">Coordinator triage</text>
      <path d="M538 25H613" class="flow" marker-end="url(#arrowGreen)"/>
      <rect x="618" y="0" width="238" height="50" rx="14" class="amberSoft"/>
      <text x="737" y="31" class="h3 center">Owner review</text>
      <path d="M856 25H931" class="flow dash" marker-end="url(#arrowGreen)"/>
      <rect x="936" y="0" width="238" height="50" rx="14" class="greenSoft"/>
      <text x="1055" y="31" class="h3 center">Requester answers</text>
      <path d="M1174 25H1249" class="flow" marker-end="url(#arrowGreen)"/>
      <rect x="1254" y="0" width="238" height="50" rx="14" class="measure"/>
      <text x="1373" y="31" class="h3 center">Confirm and learn</text>
    </g>
  </g>

  <g transform="translate(72 330)">
    <rect x="0" y="0" width="250" height="108" rx="16" class="lane"/>
    <text x="28" y="43" class="labelLight">PHASES</text>
    <text x="28" y="72" class="small white">Visit lifecycle</text>
    <g transform="translate(250 0)">
      <rect x="0" y="0" width="330" height="108" class="phase"/>
      <text x="24" y="34" class="label">01</text><text x="24" y="64" class="h2">Discover</text><text x="24" y="88" class="small">Find the right entry point</text>
      <rect x="330" y="0" width="330" height="108" class="phaseAlt"/>
      <text x="354" y="34" class="label">02</text><text x="354" y="64" class="h2">Initiate</text><text x="354" y="88" class="small">Create request and context</text>
      <rect x="660" y="0" width="330" height="108" class="phase"/>
      <text x="684" y="34" class="label">03</text><text x="684" y="64" class="h2">Plan</text><text x="684" y="88" class="small">Shape locations and sessions</text>
      <rect x="990" y="0" width="330" height="108" class="phaseAlt"/>
      <text x="1014" y="34" class="label">04</text><text x="1014" y="64" class="h2">Assign and review</text><text x="1014" y="88" class="small">Route work to owners</text>
      <rect x="1320" y="0" width="330" height="108" class="phase"/>
      <text x="1344" y="34" class="label">05</text><text x="1344" y="64" class="h2">Confirm and deliver</text><text x="1344" y="88" class="small">Lock support and run visit</text>
      <rect x="1650" y="0" width="330" height="108" class="phaseAlt"/>
      <text x="1674" y="34" class="label">06</text><text x="1674" y="64" class="h2">Change and close</text><text x="1674" y="88" class="small">Manage updates and learn</text>
    </g>
  </g>

  <g transform="translate(72 452)">
    <rect x="0" y="0" width="250" height="166" rx="16" class="lane"/>
    <text x="28" y="44" class="laneText">Requester</text><text x="28" y="72" class="small white">Business user</text>
    <g transform="translate(250 0)">
      <rect x="0" y="0" width="330" height="166" class="greenSoft"/>
      <text x="24" y="35" class="h3">Needs a visit planned</text><text x="24" y="64" class="small">Sees role-aware home</text><text x="24" y="86" class="small">and request entry points</text>
      <rect x="330" y="0" width="330" height="166" class="greenSoft"/>
      <text x="354" y="35" class="h3">Submits preliminary request</text><text x="354" y="64" class="small">Adds date, audience,</text><text x="354" y="86" class="small">locations and intent</text>
      <rect x="660" y="0" width="330" height="166" class="greenSoft"/>
      <text x="684" y="35" class="h3">Refines agenda</text><text x="684" y="64" class="small">Adds sessions, services</text><text x="684" y="86" class="small">and attendee context</text>
      <rect x="990" y="0" width="330" height="166" class="greenSoft"/>
      <text x="1014" y="35" class="h3">Answers focused questions</text><text x="1014" y="64" class="small">Responds from activity</text><text x="1014" y="86" class="small">without email hunting</text>
      <rect x="1320" y="0" width="330" height="166" class="greenSoft"/>
      <text x="1344" y="35" class="h3">Tracks confirmations</text><text x="1344" y="64" class="small">Sees service status,</text><text x="1344" y="86" class="small">risks and next steps</text>
      <rect x="1650" y="0" width="330" height="166" class="greenSoft"/>
      <text x="1674" y="35" class="h3">Reviews outcome</text><text x="1674" y="64" class="small">Receives closure summary</text><text x="1674" y="86" class="small">and feedback prompt</text>
    </g>
  </g>

  <g transform="translate(72 618)">
    <rect x="0" y="0" width="250" height="166" rx="16" class="laneAlt"/>
    <text x="28" y="44" class="laneText">Coordinator</text><text x="28" y="72" class="small white">Operational owner</text>
    <g transform="translate(250 0)">
      <rect x="0" y="0" width="330" height="166" class="blueSoft"/>
      <text x="24" y="35" class="h3">Monitors intake</text><text x="24" y="64" class="small">Views new requests,</text><text x="24" y="86" class="small">risk and priority signals</text>
      <rect x="330" y="0" width="330" height="166" class="blueSoft"/>
      <text x="354" y="35" class="h3">Triage and validate</text><text x="354" y="64" class="small">Checks missing context</text><text x="354" y="86" class="small">before routing work</text>
      <rect x="660" y="0" width="330" height="166" class="blueSoft"/>
      <text x="684" y="35" class="h3">Builds visit structure</text><text x="684" y="64" class="small">Coordinates locations,</text><text x="684" y="86" class="small">sessions and dependencies</text>
      <rect x="990" y="0" width="330" height="166" class="blueSoft"/>
      <text x="1014" y="35" class="h3">Assigns service owners</text><text x="1014" y="64" class="small">Uses queues, workload</text><text x="1014" y="86" class="small">and SLA signals</text>
      <rect x="1320" y="0" width="330" height="166" class="blueSoft"/>
      <text x="1344" y="35" class="h3">Resolves blockers</text><text x="1344" y="64" class="small">Escalates risks and</text><text x="1344" y="86" class="small">locks final readiness</text>
      <rect x="1650" y="0" width="330" height="166" class="blueSoft"/>
      <text x="1674" y="35" class="h3">Closes the visit</text><text x="1674" y="64" class="small">Captures lessons, late</text><text x="1674" y="86" class="small">changes and exceptions</text>
    </g>
  </g>

  <g transform="translate(72 784)">
    <rect x="0" y="0" width="250" height="180" rx="16" class="lane"/>
    <text x="28" y="44" class="laneText">Service owner</text><text x="28" y="72" class="small white">Team or function lead</text>
    <g transform="translate(250 0)">
      <rect x="0" y="0" width="330" height="180" class="amberSoft"/>
      <text x="24" y="35" class="h3">Receives only relevant work</text><text x="24" y="64" class="small">No separate tool; role view</text><text x="24" y="86" class="small">filters the shared record</text>
      <rect x="330" y="0" width="330" height="180" class="amberSoft"/>
      <text x="354" y="35" class="h3">Sees request context</text><text x="354" y="64" class="small">Audience, intent and</text><text x="354" y="86" class="small">support expectations</text>
      <rect x="660" y="0" width="330" height="180" class="amberSoft"/>
      <text x="684" y="35" class="h3">Checks feasibility</text><text x="684" y="64" class="small">Reviews date, capacity,</text><text x="684" y="86" class="small">dependencies and details</text>
      <rect x="990" y="0" width="330" height="180" class="amberSoft"/>
      <text x="1014" y="35" class="h3">Confirms or asks</text><text x="1014" y="64" class="small">Can request focused</text><text x="1014" y="86" class="small">clarification in context</text>
      <rect x="1320" y="0" width="330" height="180" class="amberSoft"/>
      <text x="1344" y="35" class="h3">Delivers assigned service</text><text x="1344" y="64" class="small">Updates completion and</text><text x="1344" y="86" class="small">arrival readiness</text>
      <rect x="1650" y="0" width="330" height="180" class="amberSoft"/>
      <text x="1674" y="35" class="h3">Flags impact of changes</text><text x="1674" y="64" class="small">Late edits re-open only</text><text x="1674" y="86" class="small">affected service tasks</text>
    </g>
  </g>

  <g transform="translate(72 964)">
    <rect x="0" y="0" width="250" height="150" rx="16" class="laneAlt"/>
    <text x="28" y="44" class="laneText">Admin view</text><text x="28" y="72" class="small white">Leadership and ops</text>
    <g transform="translate(250 0)">
      <rect x="0" y="0" width="330" height="150" class="measure"/>
      <text x="24" y="35" class="h3">Portfolio visibility</text><text x="24" y="64" class="small">Demand, visit mix and</text><text x="24" y="86" class="small">regional workload</text>
      <rect x="330" y="0" width="330" height="150" class="measure"/>
      <text x="354" y="35" class="h3">Data quality watch</text><text x="354" y="64" class="small">Missing fields and</text><text x="354" y="86" class="small">request completeness</text>
      <rect x="660" y="0" width="330" height="150" class="measure"/>
      <text x="684" y="35" class="h3">Capacity signals</text><text x="684" y="64" class="small">Upcoming service load</text><text x="684" y="86" class="small">and owner availability</text>
      <rect x="990" y="0" width="330" height="150" class="measure"/>
      <text x="1014" y="35" class="h3">SLA and blockers</text><text x="1014" y="64" class="small">Aging assignments and</text><text x="1014" y="86" class="small">at-risk confirmations</text>
      <rect x="1320" y="0" width="330" height="150" class="measure"/>
      <text x="1344" y="35" class="h3">Readiness rollup</text><text x="1344" y="64" class="small">Confirmed, pending and</text><text x="1344" y="86" class="small">declined services</text>
      <rect x="1650" y="0" width="330" height="150" class="measure"/>
      <text x="1674" y="35" class="h3">Trends and exports</text><text x="1674" y="64" class="small">Repeat issues, service</text><text x="1674" y="86" class="small">performance and learning</text>
    </g>
  </g>

  <g transform="translate(72 1114)">
    <rect x="0" y="0" width="250" height="186" rx="16" class="lane"/>
    <text x="28" y="44" class="laneText">System and data</text><text x="28" y="72" class="small white">Shared Captivate layer</text>
    <g transform="translate(250 0)">
      <rect x="0" y="0" width="330" height="186" class="system"/>
      <text x="24" y="35" class="h3">Role-based landing</text><text x="24" y="64" class="small">Profile switcher sets</text><text x="24" y="86" class="small">workspace permissions</text>
      <rect x="330" y="0" width="330" height="186" class="system"/>
      <text x="354" y="35" class="h3">Shared visit record</text><text x="354" y="64" class="small">Visit, location, session,</text><text x="354" y="86" class="small">service and attendee data</text>
      <rect x="660" y="0" width="330" height="186" class="system"/>
      <text x="684" y="35" class="h3">Dependency model</text><text x="684" y="64" class="small">Links services to dates,</text><text x="684" y="86" class="small">rooms and session needs</text>
      <rect x="990" y="0" width="330" height="186" class="system"/>
      <text x="1014" y="35" class="h3">Assignment engine</text><text x="1014" y="64" class="small">Routes work, records</text><text x="1014" y="86" class="small">owner decisions and SLAs</text>
      <rect x="1320" y="0" width="330" height="186" class="system"/>
      <text x="1344" y="35" class="h3">Notification layer</text><text x="1344" y="64" class="small">Activity, email alerts,</text><text x="1344" y="86" class="small">status changes and audit</text>
      <rect x="1650" y="0" width="330" height="186" class="system"/>
      <text x="1674" y="35" class="h3">Reporting model</text><text x="1674" y="64" class="small">Operational metrics,</text><text x="1674" y="86" class="small">exports and audit history</text>
    </g>
  </g>

  <g transform="translate(72 1300)">
    <rect x="0" y="0" width="250" height="178" rx="16" class="laneAlt"/>
    <text x="28" y="44" class="laneText">Risks and measures</text><text x="28" y="72" class="small white">Improvement scope</text>
    <g transform="translate(250 0)">
      <rect x="0" y="0" width="330" height="178" class="redSoft"/>
      <text x="24" y="35" class="h3">Risk</text><text x="24" y="64" class="small">Users miss the correct</text><text x="24" y="86" class="small">role or next task</text><text x="24" y="121" class="h3">Measure</text><text x="24" y="149" class="small">Task discovery rate</text>
      <rect x="330" y="0" width="330" height="178" class="redSoft"/>
      <text x="354" y="35" class="h3">Risk</text><text x="354" y="64" class="small">Incomplete requests create</text><text x="354" y="86" class="small">manual follow-ups</text><text x="354" y="121" class="h3">Measure</text><text x="354" y="149" class="small">First-pass completeness</text>
      <rect x="660" y="0" width="330" height="178" class="redSoft"/>
      <text x="684" y="35" class="h3">Risk</text><text x="684" y="64" class="small">Dependencies are unclear</text><text x="684" y="86" class="small">across services</text><text x="684" y="121" class="h3">Measure</text><text x="684" y="149" class="small">Planning rework volume</text>
      <rect x="990" y="0" width="330" height="178" class="redSoft"/>
      <text x="1014" y="35" class="h3">Risk</text><text x="1014" y="64" class="small">Owners miss assignments</text><text x="1014" y="86" class="small">or lack context</text><text x="1014" y="121" class="h3">Measure</text><text x="1014" y="149" class="small">SLA and question cycle time</text>
      <rect x="1320" y="0" width="330" height="178" class="redSoft"/>
      <text x="1344" y="35" class="h3">Risk</text><text x="1344" y="64" class="small">Readiness is hard to trust</text><text x="1344" y="86" class="small">near the visit date</text><text x="1344" y="121" class="h3">Measure</text><text x="1344" y="149" class="small">Confirmed service ratio</text>
      <rect x="1650" y="0" width="330" height="178" class="redSoft"/>
      <text x="1674" y="35" class="h3">Risk</text><text x="1674" y="64" class="small">Learning remains trapped</text><text x="1674" y="86" class="small">in individual teams</text><text x="1674" y="121" class="h3">Measure</text><text x="1674" y="149" class="small">Repeat issue reduction</text>
    </g>
  </g>

  <g>
    <path d="M567 582H702" class="flow" marker-end="url(#arrowGreen)"/>
    <path d="M897 582H1032" class="flow" marker-end="url(#arrowGreen)"/>
    <path d="M1227 582H1362" class="flow" marker-end="url(#arrowGreen)"/>
    <path d="M1557 582H1692" class="flow" marker-end="url(#arrowGreen)"/>
    <path d="M1887 582H2022" class="flow" marker-end="url(#arrowGreen)"/>
    <path d="M567 748H702" class="flowBlue" marker-end="url(#arrowBlue)"/>
    <path d="M897 748H1032" class="flowBlue" marker-end="url(#arrowBlue)"/>
    <path d="M1227 748H1362" class="flowBlue" marker-end="url(#arrowBlue)"/>
    <path d="M1557 748H1692" class="flowBlue" marker-end="url(#arrowBlue)"/>
    <path d="M1887 748H2022" class="flowBlue" marker-end="url(#arrowBlue)"/>
  </g>

  <g transform="translate(72 1530)">
    <rect x="0" y="0" width="2256" height="72" rx="18" class="panel"/>
    <circle cx="32" cy="36" r="10" class="green"/><text x="52" y="41" class="small">Solid green arrows: primary visit flow</text>
    <circle cx="330" cy="36" r="10" fill="#2765a8"/><text x="350" y="41" class="small">Blue arrows: coordinator handoffs</text>
    <circle cx="610" cy="36" r="10" fill="#a86000"/><text x="630" y="41" class="small">Dashed amber arrows: clarification loops</text>
    <text x="1100" y="41" class="small">Design implication: keep admin reporting inside Captivate, exposed as a role-based workspace rather than a separate dashboard.</text>
  </g>
</svg>
